<style>
/*
VOICE: ferramenta de trabalho premium, calma e rápida, com cara de app nativo do iPhone.
IDEA: a identidade da Apex Academy num grafite médio (nem branco, nem preto) com dourado, aplicada a um WhatsApp de bolso.
PICTURE: a conversa aberta é a peça central; os funis viram fichas douradas acima do teclado.
COLOUR and TYPE: grafite #1f2126/#2a2d34, texto #eceef2, dourado #f2b632; títulos em Playfair Display, corpo em SF Pro.
LAYOUT: título grande à esquerda, abas embaixo, conversa abre por cima com voltar.
*/
:root{color-scheme:dark;
--bg:#1f2126;--bg2:#2a2d34;--card:#2a2d34;--ink:#eceef2;--mute:#9a9ea8;--line:rgba(255,255,255,.08);--acc:#f2b632;--acc-t:#f4c55c;--acc-soft:rgba(242,182,50,.14);--acc-ink:#1d1d1f;
--me:#4d4222;--them:#30343c;--wall:#1b1d22;--red:#ff6b61;--ok:#4cd964;--tab:rgba(31,33,38,.92);--blue:#53bdeb;--serif:"Playfair Display",Georgia,"Times New Roman",serif;
--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
input,select,textarea{font-size:16px!important}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
.hide{display:none!important}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}
.top{padding:calc(var(--st) + 6px) 16px 8px;background:var(--bg);display:flex;align-items:flex-end;gap:10px}
.top h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;letter-spacing:-.2px;margin:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--bg2);color:var(--mute);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:rgba(76,217,100,.12)}.pill.bad{color:var(--red);background:rgba(255,107,97,.12)}
.auto{border:1px solid rgba(242,182,50,.55);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;background:var(--acc-soft);color:var(--acc-t)}
.auto.off{background:rgba(255,107,97,.1);border-color:rgba(255,107,97,.4);color:var(--red)}
.sub{display:flex;gap:8px;align-items:center;padding:0 16px 10px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--sb) + 76px)}
.search{margin:0 16px 8px;position:relative}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px 0 34px;font-size:16px;color:var(--ink);outline:none}
.search svg{position:absolute;left:10px;top:11px;width:16px;height:16px;color:var(--mute)}
.list{background:var(--card)}
.crow{display:flex;gap:12px;align-items:center;width:100%;padding:9px 16px;border:0;background:none;text-align:left}
.crow:active{background:var(--bg2)}
.av{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff}
.cmain{flex:1;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);padding-bottom:10px;min-width:0}
.cline{display:flex;gap:8px;align-items:baseline}
.cname{flex:1;font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctime{font-size:13px;color:var(--mute);flex:none}.ctime.u{color:var(--acc-t);font-weight:600}
.cprev{flex:1;font-size:14.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--acc);color:var(--acc-ink);border-radius:99px;font-size:12px;font-weight:700;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;flex:none}
.tick{color:var(--mute)}.tick.r{color:var(--blue)}
.grp{font-size:11px;font-weight:700;color:var(--acc-t);text-transform:uppercase;letter-spacing:1.4px;padding:20px 16px 8px}
.card{background:var(--card);border-radius:16px;margin:0 16px 12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.card>.row:first-child{border-top:0}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--acc);background:#3a3e47!important}
.ic svg{width:18px;height:18px}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col{display:flex;flex-direction:column;flex:1;min-width:0}
.btn{border:0;border-radius:12px;min-height:46px;padding:0 18px;font-size:16px;font-weight:600;background:var(--acc);color:var(--acc-ink)}
.btn:active{opacity:.8}.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.red{background:rgba(255,107,97,.12);color:var(--red)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:9px}.btn.block{width:100%}.btn:disabled{opacity:.45}
.empty{color:var(--mute);text-align:center;padding:36px 24px;font-size:15px}
.bar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:7px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#d99a1e,#f2b632)}
label.l{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
.field{width:100%;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:46px;outline:none;-webkit-appearance:none}
.field:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.form{padding:2px 16px 16px}
/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--tab);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 0 calc(var(--sb) + 4px);z-index:5}
.tabs button{border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;padding:2px 0;position:relative}
.tabs svg{width:26px;height:26px}.tabs button.on{color:var(--acc-t)}
.tabs .dotc{position:absolute;top:0;left:calc(50% + 8px);background:var(--acc);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;min-width:16px;height:16px;line-height:16px}
/* conversa */
.chat{position:fixed;inset:0;background:var(--wall);display:flex;flex-direction:column;z-index:8;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.chat.open{transform:none}
.chead{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 4px) 10px 8px 4px;background:rgba(36,38,44,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.back{border:0;background:none;color:var(--ink);display:flex;align-items:center;padding:6px;font-size:17px}
.back svg{width:24px;height:24px}
.chead .av{width:38px;height:38px;font-size:15px}
.chead .col .t{font-size:16.5px}
.hbtn{border:1px solid rgba(242,182,50,.5);background:var(--acc-soft);border-radius:99px;width:36px;height:36px;display:grid;place-items:center;color:var(--acc-t);flex:none}
.hbtn svg{width:19px;height:19px}
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 6px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:#2a2d34;color:var(--mute);font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:8px;margin:8px 0;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.b{max-width:82%;padding:6px 9px 4px;border-radius:10px;font-size:16px;line-height:1.32;box-shadow:0 1px 1px rgba(0,0,0,.08);word-wrap:break-word;white-space:pre-wrap;position:relative}
.b.me{align-self:flex-end;background:var(--me);border-top-right-radius:3px;box-shadow:0 1px 1px rgba(0,0,0,.2)}
.b.th{align-self:flex-start;background:var(--them);border-top-left-radius:3px}
.b.pend{opacity:.6}
.b .meta{float:right;margin:6px 0 -2px 10px;font-size:11px;color:var(--mute);display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.b img{display:block;max-width:220px;width:100%;border-radius:7px;margin:-2px -5px 4px;filter:blur(.3px)}
.b .lab{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--mute);font-size:14.5px}
.banner{background:rgba(255,59,48,.1);color:var(--red);font-size:13.5px;text-align:center;padding:7px 12px}
.quick{display:flex;gap:7px;overflow-x:auto;padding:8px 10px 4px;background:rgba(36,38,44,.96);border-top:1px solid var(--line);scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px 0 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14.5px;font-weight:500;white-space:nowrap}
.chip.f{border-color:rgba(242,182,50,.6);background:var(--acc-soft);color:var(--acc-t);font-weight:600}
.chip svg{width:15px;height:15px}
.comp{display:flex;align-items:flex-end;gap:8px;padding:6px 10px calc(var(--sb) + 8px);background:rgba(36,38,44,.96)}
.comp textarea{flex:1;resize:none;max-height:120px;min-height:38px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.3;padding:8px 14px;outline:none}
.send{width:40px;height:40px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}.send:disabled{opacity:.4}
/* folhas */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;z-index:20;animation:fade .18s}
.sheet>div{background:var(--bg);width:100%;border-radius:14px 14px 0 0;padding:8px 16px calc(var(--sb) + 16px);max-height:86vh;overflow:auto;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-family:var(--serif);font-weight:400;font-size:24px}.sheet p{margin:0 0 16px;color:var(--mute)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;top:calc(var(--st) + 10px);transform:translate(-50%,-20px);background:#3a3e47;color:#f5f5f7;border:1px solid rgba(242,182,50,.45);padding:10px 16px;border-radius:12px;font-size:14.5px;font-weight:500;z-index:30;max-width:88vw;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.st-pending,.st-running{color:var(--acc-t)}.st-done{color:var(--ok)}.st-error{color:var(--red)}
/* login */
.login{max-width:420px;margin:0 auto;padding:calc(var(--st) + 60px) 24px 24px}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(150deg,#3a3a3c,#0b0b0d 60%,#202024);display:grid;place-items:center;margin-bottom:18px;box-shadow:0 12px 28px rgba(0,0,0,.18);border:1px solid rgba(242,182,50,.5)}
.logo svg{width:34px;height:34px}
.login h1{font-family:var(--serif);font-weight:400;font-size:38px;margin:0 0 6px}
@media (prefers-reduced-motion:reduce){.chat,.sheet,.sheet>div,.toast{transition:none;animation:none}}
</style>

// ---------- Supabase (REST)
async function authReq(path, body) {
  const r = await fetch(CONFIG.url + '/auth/v1/' + path, { method: 'POST', headers: { apikey: CONFIG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || 'Erro ' + r.status);
  return j;
}
function saveSession(j) { ls.set('zf_sess', { at: j.access_token, rt: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 }); }
let refreshing = null;
async function token() {
  const s = ls.get('zf_sess');
  if (!s) throw new Error('login');
  if (Date.now() < s.exp - 60000) return s.at;
  if (!refreshing) refreshing = authReq('token?grant_type=refresh_token', { refresh_token: s.rt }).then((j) => { saveSession(j); return j.access_token; }).finally(() => setTimeout(() => (refreshing = null), 0));
  return refreshing;
}
async function rest(path, opts) {
  opts = opts || {};
  let t;
  try { t = await token(); } catch (e) { logout(); throw e; }
  const r = await fetch(CONFIG.url + '/rest/v1/' + path, { method: opts.method || 'GET', headers: Object.assign({ apikey: CONFIG.key, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, opts.headers || {}), body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) { logout(); throw new Error('Sessão expirou, entre de novo'); }
  if (!r.ok) throw new Error('Erro ' + r.status + ' ' + (await r.text()).slice(0, 120));
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
async function command(kind, payload, label, quiet) {
  if (!macOnline() && !quiet) toast('O Mac parece offline — o pedido espera até 15 min');
  const rows = await rest('zf_commands', { method: 'POST', headers: { Prefer: 'return=representation' }, body: { kind, payload } });
  const row = rows && rows[0];
  if (row && label) { row.label = label; cmds.unshift(row); const lab = ls.get('zf_labels') || {}; lab[row.id] = label; ls.set('zf_labels', lab); }
  fastPoll();
  return row;
}

// ---------- ciclo de atualização
function macOnline() { return !!(stateAt && Date.now() - stateAt < 75000 && S && S.waReady); }
async function refresh() {
  try {
    const st = await rest('zf_state?select=data,updated_at');
    if (st && st[0]) { S = st[0].data || {}; stateAt = new Date(st[0].updated_at).getTime(); }
    const c = await rest('zf_commands?select=id,kind,payload,status,result,created_at&order=id.desc&limit=30');
    const lab = ls.get('zf_labels') || {};
    cmds = (c || []).filter((x) => !HIDE_KINDS.includes(x.kind)).map((x) => Object.assign(x, { label: lab[x.id] || x.kind }));
    render();
  } catch (e) { if (e.message !== 'login') { $('#macSt').className = 'pill bad'; $('#macSt').innerHTML = '<i></i>sem internet'; } }
}
function schedule(ms) { clearTimeout(pollT); pollT = setTimeout(async () => { if (document.visibilityState === 'visible') await refresh(); schedule(cmds.some((c) => c.status === 'pending' || c.status === 'running') ? 2500 : 6000); }, ms); }
function fastPoll() { schedule(1200); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { refresh(); fastPoll(); if (chat) { watchChat(true); pollChat(); } } });

// ---------- login
function logout() { ls.del('zf_sess'); closeChat(); $('#app').classList.add('hide'); $('#login').classList.remove('hide'); }
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#loginBtn').disabled = true; $('#loginErr').textContent = '';
  try { const j = await authReq('token?grant_type=password', { email: $('#em').value.trim(), password: $('#pw').value }); saveSession(j); start(); }
  catch (err) { $('#loginErr').textContent = /confirm/i.test(err.message) ? 'Confirme seu e-mail primeiro.' : /invalid/i.test(err.message) ? 'E-mail ou senha incorretos.' : err.message; }
  finally { $('#loginBtn').disabled = false; }
});
function start() { $('#login').classList.add('hide'); $('#app').classList.remove('hide'); render(); refresh(); fastPoll(); }

// ---------- utilidades de exibição
const num = (id) => String(id || '').replace(/@.*/, '');
const isPhone = (id) => /^\d{8,15}$/.test(num(id));
const fmtNum = (id) => (isPhone(id) ? '+' + num(id) : '');
const normNum = (raw) => { const s = String(raw || '').trim(); let d = s.replace(/\D/g, ''); if (!d) return ''; if (s.startsWith('+')) return d; if (d.startsWith('00')) return d.slice(2); if ((d.length === 10 || d.length === 11) && !d.startsWith('55')) d = '55' + d; return d; };
const COLORS = ['#3a3e47', '#454a55', '#4d4222', '#3a3e47', '#41454f'];
function avatar(name, id, size) { const k = String(id || name || '?'); let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) >>> 0; const ini = (String(name || '').trim().split(/\s+/).map((w) => w[0]).filter((c) => /\p{L}/u.test(c || '')).slice(0, 2).join('') || '#').toUpperCase(); return `<div class="av" style="color:#f2b632;background:${COLORS[h % COLORS.length]}${size ? ';width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.38) + 'px' : ''}">${esc(ini)}</div>`; }
function when(tsMs) { if (!tsMs) return ''; const d = new Date(tsMs), n = new Date(); const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); const diff = (day(n) - day(d)) / 86400000; if (diff === 0) return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); if (diff === 1) return 'Ontem'; if (diff < 7) return d.toLocaleDateString('pt-BR', { weekday: 'long' }); return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' }); }
const hm = (ms) => new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const whenFull = (ms) => { const w = when(ms); return /^\d\d:\d\d$/.test(w) ? w : w + ' ' + hm(ms); };
function ticks(ack) { if (!ack) return '<span class="tick">🕓</span>'; return ack >= 3 ? '<span class="tick r">✓✓</span>' : ack === 2 ? '<span class="tick">✓✓</span>' : '<span class="tick">✓</span>'; }
function typeIcon(t) { const [ic] = TYPE[t] || TYPE.text; return `<span class="ic">${svg(ic)}</span>`; }
function entries() {
  if (!S) return [];
  return [...(S.funnels || []).map((f, i) => ({ kind: 'funnel', t: 'funnel', id: f.id, name: f.name, sub: f.steps + ' etapa(s)', i })),
    ...(S.items || []).map((x, i) => ({ kind: 'item', t: x.type, id: x.id, name: x.name, sub: x.type === 'audio' ? 'Áudio ' + Math.round(x.duration || 0) + 's' : x.text || TYPE[x.type][2], i }))]
    .sort((a, b) => ORDER[a.t] - ORDER[b.t] || (a.kind === b.kind ? a.i - b.i : 0));
}

  const el = $('#v-chats');
  if (!el.querySelector('#cq')) {
    el.innerHTML = `<div class="search">${svg('search')}<input id="cq" placeholder="Buscar ou digitar número" autocomplete="off" inputmode="search"></div><div id="clist" class="list"></div>`;

}
function rChatList() {
  const list = $('#clist'); if (!list) return;
  const chats = (S && S.chats) || [];
  const f = q.trim().toLowerCase(), fd = f.replace(/\D/g, '');
  const shown = chats.filter((c) => !f || (c.name || '').toLowerCase().includes(f) || (fd.length >= 3 && num(c.id).includes(fd)));
  const typed = normNum(q);
  let h = '';
  if (typed.length >= 10 && !/[a-z]/i.test(q) && !shown.some((c) => num(c.id) === typed)) h += `<button class="crow" data-open="${typed}@c.us" data-name=""><div class="av" style="background:var(--acc);color:#1d1d1f">${svg('new')}</div><div class="cmain"><div class="cline"><span class="cname">+${typed}</span></div><div class="cline"><span class="cprev">Abrir conversa com este número</span></div></div></button>`;
  h += shown.map((c) => {
    const l = c.last;
    return `<button class="crow" data-open="${esc(c.id)}" data-name="${esc(c.name)}">${avatar(c.name || fmtNum(c.id), c.id)}<div class="cmain"><div class="cline"><span class="cname">${esc(c.name || fmtNum(c.id) || 'Contato')}</span><span class="ctime${c.unread ? ' u' : ''}">${when((c.t || 0) * 1000)}</span></div>

// ---------- conversa aberta
async function watchChat(force) {
  if (!chat) return;
  if (!force && Date.now() - watchAt < 90000) return;
  watchAt = Date.now();
  try { await command('watch_chat', { chatId: chat.id }, null, true); } catch (e) {}
}
async function pollChat() {
  if (!chat) return;
  clearTimeout(chatT);
  try {
    const rows = await rest('zf_chats?chat_id=eq.' + encodeURIComponent(chat.id) + '&select=data,updated_at');
    if (chat && rows && rows[0]) {
      const d = rows[0].data || {};
      if (d.at !== chat.at) { chat.msgs = d.msgs || []; chat.at = d.at; if (d.name && !chat.name) chat.name = d.name; chat.pend = chat.pend.filter((p) => !chat.msgs.some((m) => m.fromMe && m.text === p.text && m.t * 1000 >= p.t - 60000)); renderChat(true); }
    }
  } catch (e) {}
  watchChat(false);
  if (chat) chatT = setTimeout(pollChat, document.visibilityState === 'visible' ? 2500 : 15000);
}
function openChat(id, name) {
  const c = ((S && S.chats) || []).find((x) => x.id === id);
  chat = { id, name: name || (c && c.name) || '', msgs: null, at: null, pend: [] };
  $('#chat').classList.add('open'); $('#chat').setAttribute('aria-hidden', 'false');
  $('#txt').value = ''; $('#sendBtn').disabled = true;
  renderChat(true);
  watchAt = 0; watchChat(true);
  pollChat();
}
function closeChat() { chat = null; clearTimeout(chatT); $('#chat').classList.remove('open'); $('#chat').setAttribute('aria-hidden', 'true'); $('#txt').blur(); }
$('#back').onclick = closeChat;
$('#cRmkt').onclick = () => chat && pickRule(chat.id, chat.name);

function bubble(m) {
  const meta = `<span class="meta">${hm((m.t || 0) * 1000)}${m.fromMe ? ' ' + ticks(m.ack) : ''}</span>`;
  let body = '';
  if (m.type === 'chat') body = esc(m.text);
  else {
    if (m.thumb) body += `<img src="${m.thumb}" alt="">`;
    else body += `<span class="lab">${esc(m.label || 'Mensagem')}${m.file ? ' · ' + esc(m.file) : ''}</span>`;
    if (m.text) body += (m.thumb ? '' : '\n') + esc(m.text);
  }
  return `<div class="b ${m.fromMe ? 'me' : 'th'}">${body}${meta}</div>`;
}
function renderChat(scroll) {
  if (!chat) return;
  const c = ((S && S.chats) || []).find((x) => x.id === chat.id);
  const name = chat.name || (c && c.name) || fmtNum(chat.id) || 'Contato';
  $('#cAv').outerHTML = avatar(name, chat.id).replace('class="av"', 'class="av" id="cAv"');
  $('#cName').textContent = name;
  const inQ = ((S && S.queue) || []).filter((e) => e.chatId === chat.id);
  const run = ((S && S.running) || []).find((r) => r.chatId === chat.id);
  $('#cSub').textContent = run ? 'enviando ' + run.label + ' (' + run.step + '/' + run.total + ')…' : inQ.length ? 'em remarketing: ' + inQ.map((e) => e.rule).join(', ') : fmtNum(chat.id);
  const ban = $('#cBanner');
  if (!macOnline()) { ban.textContent = 'Mac offline — mensagens novas aparecem quando ele voltar'; ban.classList.remove('hide'); } else ban.classList.add('hide');
  const box = $('#msgs');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  if (chat.msgs === null) box.innerHTML = '<div class="empty">Carregando mensagens do Mac…</div>';
  else {
    let h = '', lastDay = '';
    for (const m of chat.msgs) { const d = new Date((m.t || 0) * 1000).toDateString(); if (d !== lastDay) { lastDay = d; h += `<div class="day">${when((m.t || 0) * 1000).replace(/^\d\d:\d\d$/, 'Hoje')}</div>`; } h += bubble(m); }
    h += chat.pend.map((p) => `<div class="b me pend">${esc(p.text)}<span class="meta">${hm(p.t)} <span class="tick">🕓</span></span></div>`).join('');
    box.innerHTML = h || '<div class="empty">Nenhuma mensagem ainda. Mande um funil ou escreva abaixo.</div>';
  }
  if (scroll || nearBottom) box.scrollTop = box.scrollHeight;
  const quick = $('#quick');
  const sig = JSON.stringify(entries().map((x) => x.id + x.name));
  if (quick.dataset.sig !== sig) {
    quick.dataset.sig = sig;
    quick.innerHTML = entries().map((x) => `<button class="chip${x.kind === 'funnel' ? ' f' : ''}" data-k="${x.kind}" data-id="${esc(x.id)}">${svg(TYPE[x.t][0])}${esc(x.name)}</button>`).join('');
    quick.querySelectorAll('.chip').forEach((b) => (b.onclick = () => { const e = entries().find((x) => x.id === b.dataset.id && x.kind === b.dataset.k); if (e && chat) confirmSend(e, chat.id, chat.name); }));
  }
}
const txt = $('#txt');
txt.addEventListener('input', () => { txt.style.height = 'auto'; txt.style.height = Math.min(120, txt.scrollHeight) + 'px'; $('#sendBtn').disabled = !txt.value.trim(); });
$('#sendBtn').onclick = async () => {
  const text = txt.value.trim(); if (!text || !chat) return;
  $('#sendBtn').disabled = true;
  try {
    await command('send_text', { chatId: chat.id, text }, '✍️ ' + text.slice(0, 30) + ' → ' + (chat.name || fmtNum(chat.id)), true);
    chat.pend.push({ text, t: Date.now() }); txt.value = ''; txt.style.height = 'auto'; renderChat(true); setTimeout(pollChat, 2500);
  } catch (e) { toast(e.message); $('#sendBtn').disabled = false; }
};

if (ls.get('zf_sess')) start(); else logout();
}
</script>
</body>
</html>

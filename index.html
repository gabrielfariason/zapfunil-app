<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZapFunil">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#1f2126">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap">
<title>ZapFunil</title>
<style>
/*
VOICE: ferramenta de trabalho premium, calma e rápida, com cara de app nativo do iPhone.
IDEA: um WhatsApp de bolso com a identidade da Apex — grafite médio, dourado e serifa elegante.
PICTURE: a conversa aberta é a peça central; funis viram fichas douradas acima do teclado; microfone igual ao WhatsApp.
COLOUR and TYPE: grafite #1f2126/#2a2d34, texto #eceef2, dourado #f2b632; títulos em Playfair Display, corpo em SF Pro.
LAYOUT: coluna com a altura real da tela (abas presas no fundo), conversa entra deslizando por cima com voltar e gesto.
*/
:root{color-scheme:dark;
--bg:#1f2126;--bg2:#272a31;--card:#2a2d34;--card2:#30343c;--ink:#eceef2;--mute:#9a9ea8;--line:rgba(255,255,255,.07);
--acc:#f2b632;--acc-t:#f4c55c;--acc-soft:rgba(242,182,50,.14);--acc-ink:#1d1d1f;
--me:#4d4222;--them:#30343c;--wall:#1a1c20;--red:#ff6b61;--ok:#4cd964;--blue:#53bdeb;
--serif:"Playfair Display",Georgia,"Times New Roman",serif;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;overflow:hidden}
input,select,textarea{font-size:16px!important;font-family:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
.hide{display:none!important}
.app{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.top{padding:calc(var(--st) + 10px) 18px 6px;display:flex;align-items:flex-end;gap:10px}
.top h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05;letter-spacing:-.2px;margin:0;flex:1}
.sub{display:flex;gap:8px;align-items:center;padding:4px 18px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--card);color:var(--mute);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:rgba(76,217,100,.12)}.pill.bad{color:var(--red);background:rgba(255,107,97,.12)}
.auto{border:1px solid rgba(242,182,50,.55);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:650;background:var(--acc-soft);color:var(--acc-t)}
.auto.off{background:rgba(255,107,97,.1);border-color:rgba(255,107,97,.4);color:var(--red)}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(36,38,44,.98);border-top:1px solid var(--line);padding:6px 0 max(6px,var(--sb))}
.tabs button{color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:3px 0;position:relative}
.tabs svg{width:25px;height:25px}.tabs button.on{color:var(--acc-t)}
.tabs .cnt{position:absolute;top:-2px;left:calc(50% + 6px);background:var(--acc);color:var(--acc-ink);font-size:10.5px;font-weight:800;border-radius:99px;padding:0 5px;min-width:17px;height:17px;line-height:17px;text-align:center}
.search{margin:2px 16px 10px;position:relative}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px 0 36px;color:var(--ink);outline:none}
.search input:focus{border-color:rgba(242,182,50,.55)}
.search svg{position:absolute;left:11px;top:12px;width:16px;height:16px;color:var(--mute)}
.crow{display:flex;gap:12px;align-items:center;width:100%;padding:8px 16px;text-align:left;transition:background .15s}
.crow:active{background:var(--bg2)}
.av{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--acc-t);background:#3a3e47;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.av svg{width:55%;height:55%;color:#8a8f99}
.cmain{flex:1;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line);padding:4px 0 11px;min-width:0}
.cline{display:flex;gap:8px;align-items:center}
.cname{flex:1;font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctime{font-size:13px;color:var(--mute);flex:none}.ctime.u{color:var(--acc-t);font-weight:600}
.cprev{flex:1;font-size:14.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--acc);color:var(--acc-ink);border-radius:99px;font-size:12px;font-weight:800;min-width:21px;height:21px;padding:0 6px;display:grid;place-items:center;flex:none}
.badge.dot{min-width:12px;width:12px;height:12px;padding:0}
.tick{color:var(--mute);letter-spacing:-3px;margin-right:3px}.tick.r{color:var(--blue)}
.grp{font-size:11px;font-weight:700;color:var(--acc-t);text-transform:uppercase;letter-spacing:1.4px;padding:18px 18px 8px}
.card{background:var(--card);border-radius:16px;margin:0 16px 12px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.card>.row:first-child{border-top:0}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--acc);background:#3a3e47}
.ic svg{width:18px;height:18px}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col{display:flex;flex-direction:column;flex:1;min-width:0}
.btn{border-radius:12px;min-height:46px;padding:0 18px;font-size:16px;font-weight:650;background:var(--acc);color:var(--acc-ink)}
.btn:active{opacity:.8}.btn.sec{background:var(--card2);color:var(--ink)}.btn.red{background:rgba(255,107,97,.12);color:var(--red)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:9px}.btn.block{width:100%}.btn:disabled{opacity:.45}
.empty{color:var(--mute);text-align:center;padding:40px 24px;font-size:15px}
.bar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:7px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#d99a1e,#f2b632)}
label.l{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
.field{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);min-height:46px;outline:none;-webkit-appearance:none}
.field:focus{border-color:var(--acc)}
.form{padding:4px 16px 16px}
.sw{position:relative;width:51px;height:31px;flex:none}.sw input{opacity:0;position:absolute;inset:0;margin:0;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:#4a4e58;transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--acc)}.sw input:checked+i::after{transform:translateX(20px)}
.note{font-size:13px;color:var(--mute);padding:0 18px 6px;line-height:1.45}
.chat{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;background:var(--wall);display:flex;flex-direction:column;z-index:8;transform:translate3d(100%,0,0);transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform;box-shadow:-10px 0 30px rgba(0,0,0,.35)}
.chat.open{transform:translate3d(0,0,0)}
.chat.drag{transition:none}
.chead{display:flex;align-items:center;gap:9px;padding:calc(var(--st) + 6px) 12px 9px 6px;background:rgba(36,38,44,.98);border-bottom:1px solid var(--line)}
.back{color:var(--acc-t);display:flex;align-items:center;padding:6px 2px;font-size:17px;font-weight:500}
.back svg{width:26px;height:26px}
.chead .av{width:38px;height:38px;font-size:14px}
.chead .t{font-size:16.5px}
.hbtn{border:1px solid rgba(242,182,50,.5);background:var(--acc-soft);border-radius:99px;width:36px;height:36px;display:grid;place-items:center;color:var(--acc-t);flex:none}
.hbtn svg{width:19px;height:19px}
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:10px 10px 8px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:#2a2d34;color:var(--mute);font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:8px;margin:8px 0}
.b{max-width:82%;padding:6px 9px 5px;border-radius:12px;font-size:16px;line-height:1.33;box-shadow:0 1px 1px rgba(0,0,0,.2);overflow-wrap:anywhere;white-space:pre-wrap;position:relative}
.b.me{align-self:flex-end;background:var(--me);border-top-right-radius:4px}
.b.th{align-self:flex-start;background:var(--them);border-top-left-radius:4px}
.b.pend{opacity:.65}
.b .meta{float:right;margin:7px 0 -3px 10px;font-size:11px;color:rgba(236,238,242,.55);display:inline-flex;gap:2px;align-items:center;white-space:nowrap}
.b img{display:block;max-width:230px;width:100%;border-radius:8px;margin:-2px -5px 4px}
.b .lab{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--acc-t);font-size:14.5px}
.b .lab svg{width:16px;height:16px}
.banner{background:rgba(255,107,97,.12);color:var(--red);font-size:13.5px;text-align:center;padding:7px 12px}
.quick{flex:none;display:flex;gap:7px;overflow-x:auto;padding:8px 10px 2px;background:rgba(36,38,44,.98);scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px 0 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14.5px;font-weight:500;white-space:nowrap}
.chip.f{border-color:rgba(242,182,50,.6);background:var(--acc-soft);color:var(--acc-t);font-weight:650}
.chip svg{width:15px;height:15px}
.comp{flex:none;display:flex;align-items:flex-end;gap:8px;padding:6px 10px max(8px,var(--sb));background:rgba(36,38,44,.98)}
.comp textarea{flex:1;resize:none;max-height:120px;min-height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);line-height:1.3;padding:9px 14px;outline:none}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--acc);color:var(--acc-ink)}
.round svg{width:21px;height:21px}.round.ghost{background:var(--card);color:var(--mute)}
.rec{flex:1;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:20px;background:var(--card);border:1px solid rgba(255,107,97,.4)}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.rec .tm{font-variant-numeric:tabular-nums;font-weight:650}
.rec .hint{flex:1;color:var(--mute);font-size:13.5px;text-align:right}
@keyframes blink{50%{opacity:.25}}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .18s}
.sheet>div{background:#25282e;width:100%;border-radius:16px 16px 0 0;padding:8px 16px max(16px,calc(var(--sb) + 10px));max-height:86vh;overflow:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-family:var(--serif);font-weight:400;font-size:25px}.sheet p{margin:0 0 16px;color:var(--mute)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;top:calc(var(--st) + 10px);transform:translate(-50%,-20px);background:#3a3e47;color:#f5f5f7;border:1px solid rgba(242,182,50,.45);padding:10px 16px;border-radius:12px;font-size:14.5px;font-weight:500;z-index:30;max-width:88vw;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.st-pending,.st-running{color:var(--acc-t)}.st-done{color:var(--ok)}.st-error{color:var(--red)}
.login{position:fixed;inset:0;overflow:auto;padding:calc(var(--st) + 64px) 24px 24px}
.login>div{max-width:420px;margin:0 auto}
.logo{width:66px;height:66px;border-radius:18px;background:linear-gradient(150deg,#3a3a3c,#0b0b0d 60%,#202024);display:grid;place-items:center;margin-bottom:18px;border:1px solid rgba(242,182,50,.5)}
.logo svg{width:34px;height:34px}
.login h1{font-family:var(--serif);font-weight:400;font-size:40px;margin:0 0 6px}
@media (prefers-reduced-motion:reduce){.chat,.sheet,.sheet>div,.toast{transition:none;animation:none}}
</style>
</head>

<div id="login" class="login hide"><div>
  <div class="logo"><svg><use href="#i-bolt"/></svg></div>
  <h1>ZapFunil</h1>
  <p class="s" style="white-space:normal;font-size:15px">Entre com a conta que você conectou na extensão do Chrome (aba Celular do painel).</p>
  <form id="loginForm">
    <label class="l" for="em">E-mail</label><input class="field" id="em" type="email" autocomplete="username" required>
    <label class="l" for="pw">Senha</label><input class="field" id="pw" type="password" autocomplete="current-password" required>
    <div style="height:18px"></div>
    <button class="btn block" id="loginBtn">Entrar</button>
  </form>
  <p id="loginErr" style="color:var(--red);font-size:14px"></p>
</div></div>

<div id="app" class="app hide">
  <div class="screens">
    <section class="screen" id="v-chats">
      <div class="top"><h1>Conversas</h1><button class="auto js-auto">Auto</button></div>
      <div class="sub"><span class="pill js-mac">conectando…</span></div>
      <div class="search"><svg><use href="#i-search"/></svg><input id="cq" placeholder="Buscar ou digitar número" autocomplete="off" inputmode="search"></div>
      <div id="newnum"></div>
      <div id="clist"></div>
      <div id="cempty" class="empty hide"></div>
    </section>
    <section class="screen hide" id="v-rmkt">
      <div class="top"><h1>Remarketing</h1><button class="auto js-auto">Auto</button></div>
      <div class="sub"><span class="pill js-mac"></span></div>
      <div id="rmktBody"></div>
    </section>
    <section class="screen hide" id="v-agenda">
      <div class="top"><h1>Agenda</h1><button class="auto js-auto">Auto</button></div>
      <div class="sub"><span class="pill js-mac"></span></div>

}

$('#ping').onclick = async () => { try { await command('ping', {}, 'Teste de conexão'); toast('Enviado — veja em "Seus pedidos"'); } catch (e) { toast(e.message); } };
$('#out').onclick = async () => { await sb.auth.signOut(); showLogin(); };

const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
let pushSub = null, pushPrefs = { msgs: true, errors: true, offline: true };
async function swReg() { if (!('serviceWorker' in navigator)) return null; return navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => null); }
function b64ToBytes(b64) { const p = '='.repeat((4 - (b64.length % 4)) % 4); const raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); }
async function renderPush() {
  const card = $('#pushCard');
  const supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  if (!supported) {
    card.innerHTML = `<div class="row"><span class="col"><span class="t">${isStandalone() ? 'Seu iPhone não suporta notificações' : 'Adicione o app à Tela de Início'}</span><span class="s" style="white-space:normal">${isStandalone() ? 'Atualize o iOS para 16.4 ou mais novo.' : 'No Safari: Compartilhar → Adicionar à Tela de Início. Depois abra pelo ícone e ative aqui.'}</span></span></div>`;
    return;
  }
  const reg = await swReg();
  pushSub = reg ? await reg.pushManager.getSubscription().catch(() => null) : null;
  if (pushSub) {
    const { data } = await sb.from('zf_push_subs').select('prefs').eq('endpoint', pushSub.endpoint).maybeSingle();
    if (data && data.prefs) pushPrefs = Object.assign(pushPrefs, data.prefs);
    else await saveSub(pushSub);
  }
  const on = !!pushSub && Notification.permission === 'granted';
  const sw = (k, t, s) => `<div class="row"><span class="col"><span class="t">${t}</span><span class="s" style="white-space:normal">${s}</span></span><label class="sw"><input type="checkbox" data-pref="${k}" ${pushPrefs[k] !== false ? 'checked' : ''} ${on ? '' : 'disabled'}><i></i></label></div>`;
  card.innerHTML = (on ? '' : `<div class="row"><span class="col"><span class="t">${Notification.permission === 'denied' ? 'Notificações bloqueadas' : 'Notificações desligadas'}</span><span class="s" style="white-space:normal">${Notification.permission === 'denied' ? 'Libere em Ajustes do iPhone → Notificações → ZapFunil.' : 'Receba aviso quando um lead responder ou algo der errado.'}</span></span>${Notification.permission === 'denied' ? '' : '<button class="btn sm" id="pushOn">Ativar</button>'}</div>`)
    + sw('msgs', 'Mensagens de leads', 'Toda mensagem nova de contato (grupos não).')
    + sw('errors', 'Erros e avisos', 'Funil, remarketing ou agendamento que falhou, WhatsApp desconectado, campanha concluída.')
    + sw('offline', 'Mac offline', 'Se o Mac/WhatsApp Web parar de dar sinal por 10 min.')
    + (on ? '<div class="row"><button class="btn sec block" id="pushTest">Enviar notificação de teste</button></div>' : '');
  const btn = $('#pushOn'); if (btn) btn.onclick = enablePush;
  $$('#pushCard [data-pref]').forEach((c) => (c.onchange = async () => { pushPrefs[c.dataset.pref] = c.checked; if (pushSub) await sb.from('zf_push_subs').update({ prefs: pushPrefs }).eq('endpoint', pushSub.endpoint); }));
  const tb = $('#pushTest'); if (tb) tb.onclick = async () => { const { data, error } = await sb.functions.invoke('zf-push', { body: { action: 'notify', kind: 'info', title: '⚡ ZapFunil', body: 'Notificações funcionando!' } }); toast(error ? 'Erro: ' + error.message : (data && data.sent ? 'Enviada! Deve chegar em segundos.' : 'Nenhum aparelho ativo.')); };
}
async function saveSub(sub) {
  const j = sub.toJSON();
  await sb.from('zf_push_subs').upsert({ user_id: userId, endpoint: j.endpoint, keys: j.keys, prefs: pushPrefs, ua: navigator.userAgent.slice(0, 200) }, { onConflict: 'endpoint' });
}
async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Permissão negada'); return renderPush(); }
    const reg = await swReg(); await navigator.serviceWorker.ready;
    const { data, error } = await sb.functions.invoke('zf-push', { body: { action: 'key' } });
    if (error || !data || !data.publicKey) throw new Error('não consegui a chave (' + (error ? error.message : '?') + ')');
    pushSub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(data.publicKey) });
    await saveSub(pushSub);
    toast('🔔 Notificações ativadas');
  } catch (e) { toast('Erro: ' + e.message); }
  renderPush();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'open') { try { history.replaceState(null, '', new URL(e.data.url, location.href).hash); } catch (x) {} openFromHash(); } });

let chat = null, chatChannel = null, watchAt = 0;
function openFromHash() { const m = location.hash.match(/^#c=(.+)$/); if (m && userId) openChat(decodeURIComponent(m[1]), true); }
window.addEventListener('popstate', () => { if (chat && !/^#c=/.test(location.hash)) closeChat(true); else openFromHash(); });
function openChat(id, fromHistory) {
  if (chat && chat.id === id) return;
  if (chat) closeChat(true);
  const c = ((S && S.chats) || []).find((x) => x.id === id) || { id, name: '' };
  chat = { id, c: Object.assign({}, c), msgs: null, at: null, pend: [], shown: new Map() };
  if (!fromHistory) history.pushState({ chat: id }, '', '#c=' + encodeURIComponent(id));
  const box = $('#msgs'); box.innerHTML = '<div class="empty">Carregando mensagens do Mac…</div>'; box._lastDay = '';
  txt.value = ''; txt.style.height = 'auto'; setComposer();
  $('#cAv')._sig = null;
  renderChatMeta(); renderQuick(true);
  $('#chat').classList.add('open'); $('#chat').setAttribute('aria-hidden', 'false');
  chatChannel = sb.channel('zf-chat-' + Date.now()).on('postgres_changes', { event: '*', schema: 'public', table: 'zf_chats', filter: 'chat_id=eq.' + id }, (p) => p.new && p.new.data && applyChat(p.new.data, id)).subscribe();
  watchAt = 0; watchChat(true); pollChat();
}
function closeChat(fromHistory) {
  if (!chat) return;
  stopRec(true);
  chat = null;
  if (chatChannel) { sb.removeChannel(chatChannel); chatChannel = null; }
  $('#chat').classList.remove('open'); $('#chat').setAttribute('aria-hidden', 'true'); txt.blur();
  if (!fromHistory && /^#c=/.test(location.hash)) history.back();
}
$('#back').onclick = () => closeChat(false);
$('#cRmkt').onclick = () => chat && pickRule(chat.id, displayName(chat.c));
(function edgeSwipe() {
  const el = $('#chat'); let x0 = null, dx = 0;
  el.addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t.clientX < 28) { x0 = t.clientX; dx = 0; el.classList.add('drag'); } }, { passive: true });
  el.addEventListener('touchmove', (e) => { if (x0 === null) return; dx = Math.max(0, e.touches[0].clientX - x0); el.style.transform = `translate3d(${dx}px,0,0)`; }, { passive: true });
  const end = () => { if (x0 === null) return; el.classList.remove('drag'); el.style.transform = ''; if (dx > 90) closeChat(false); x0 = null; };
  el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
})();
async function watchChat(force) {
  if (!chat || (!force && Date.now() - watchAt < 90000)) return;
  watchAt = Date.now();
  try { await command('watch_chat', { chatId: chat.id }, null, true); } catch (e) {}
}
async function pollChat() {
  if (!chat) return;
  const id = chat.id;
  const { data } = await sb.from('zf_chats').select('data').eq('chat_id', id).maybeSingle();
  if (data) applyChat(data.data, id);
  watchChat(false);
}
function applyChat(d, id) {
  if (!chat || chat.id !== id || !d || d.at === chat.at) return;
  chat.at = d.at; chat.msgs = d.msgs || [];
  if (d.name && !hasLetters(chat.c.name)) chat.c.name = d.name;
  chat.pend = chat.pend.filter((p) => !chat.msgs.some((m) => m.fromMe && m.t * 1000 >= p.t - 60000 && (p.audio ? m.type === 'ptt' : m.text === p.text)));
  renderMsgs(); renderChatMeta();
}
function bubbleHTML(m) {
  const meta = `<span class="meta">${hm((m.t || 0) * 1000)}${m.fromMe ? ' ' + ticks(m.ack) : ''}</span>`;
  let body = '';
  if (m.type === 'chat') body = esc(m.text);
  else {
    if (m.thumb) body += `<img src="${esc(m.thumb)}" alt="">`;
    else body += `<span class="lab">${esc(m.label || 'Mensagem')}${m.file ? ' · ' + esc(m.file) : ''}</span>`;
    if (m.text) body += (m.thumb ? '' : '\n') + esc(m.text);
  }
  return body + meta;
}
function renderMsgs() {
  if (!chat || !chat.msgs) return;
  const box = $('#msgs');
  const nearBottom = !chat.shown.size || box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  if (!chat.shown.size) { box.innerHTML = ''; box._lastDay = ''; }
  let lastDay = box._lastDay || '';
  $$('.b.pend', box).forEach((e) => e.remove());
  const emp = $('.empty', box); if (emp) emp.remove();
  for (const m of chat.msgs) {
    const sig = m.ack + '|' + (m.text || '') + '|' + (m.thumb ? 1 : 0) + '|' + (m.label || '');
    const old = chat.shown.get(m.id);
    if (old) { if (old._sig !== sig) { old.innerHTML = bubbleHTML(m); old._sig = sig; } continue; }
    const ms = (m.t || 0) * 1000;
    const d = new Date(ms).toDateString();
    if (d !== lastDay) { lastDay = d; const sep = document.createElement('div'); sep.className = 'day'; sep.textContent = dayLabel(ms); box.appendChild(sep); }
    const el = document.createElement('div'); el.className = 'b ' + (m.fromMe ? 'me' : 'th'); el.innerHTML = bubbleHTML(m); el._sig = sig;
    box.appendChild(el); chat.shown.set(m.id, el);
  }
  box._lastDay = lastDay;
  for (const p of chat.pend) { const el = document.createElement('div'); el.className = 'b me pend'; el.innerHTML = (p.audio ? `<span class="lab">${svg('mic')} Áudio ${mmss(p.dur)}</span>` : esc(p.text)) + `<span class="meta">${hm(p.t)} <span class="tick">🕓</span></span>`; box.appendChild(el); }
  if (!chat.msgs.length && !chat.pend.length) box.innerHTML = '<div class="empty">Nenhuma mensagem ainda. Mande um funil ou escreva abaixo.</div>';

}
function renderChatMeta() {
  if (!chat) return;
  const c = ((S && S.chats) || []).find((x) => x.id === chat.id);
  if (c) chat.c = Object.assign({}, c, { name: hasLetters(c.name) ? c.name : chat.c.name });
  const sig = JSON.stringify([chat.c.name, chat.c.pic]);
  if ($('#cAv')._sig !== sig) { $('#cAv').outerHTML = avatarHTML(chat.c, 38, 'cAv'); $('#cAv')._sig = sig; }
  $('#cName').textContent = displayName(chat.c);
  const inQ = ((S && S.queue) || []).filter((e) => e.chatId === chat.id);
  const run = ((S && S.running) || []).find((r) => r.chatId === chat.id);
  $('#cSub').textContent = run ? 'enviando ' + run.label + ' (' + run.step + '/' + run.total + ')…' : inQ.length ? 'em remarketing: ' + inQ.map((e) => e.rule).join(', ') : fmtPhone(chat.id);
  const ban = $('#cBanner');
  if (S && !macOnline()) { ban.textContent = 'Mac offline — o que você mandar sai quando ele voltar (até 15 min)'; ban.classList.remove('hide'); } else ban.classList.add('hide');
  renderQuick(false);
}
function renderQuick(force) {
  const quick = $('#quick');
  const list = entries();
  const sig = JSON.stringify(list.map((x) => x.id + x.name));
  if (!force && quick.dataset.sig === sig) return;
  quick.dataset.sig = sig;
  quick.innerHTML = list.map((x) => `<button class="chip${x.kind === 'funnel' ? ' f' : ''}" data-k="${x.kind}" data-id="${esc(x.id)}">${svg(TYPE[x.t][0])}${esc(x.name)}</button>`).join('');
  quick.classList.toggle('hide', !list.length);
}
$('#quick').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b || !chat) return; const en = entries().find((x) => x.id === b.dataset.id && x.kind === b.dataset.k); if (en) confirmSend(en, chat.id, displayName(chat.c)); });

const txt = $('#txt');
function setComposer() { const has = !!txt.value.trim(); const b = $('#sendBtn'); b.innerHTML = svg(has ? 'send' : 'mic'); b.setAttribute('aria-label', has ? 'Enviar' : 'Gravar áudio'); }
txt.addEventListener('input', () => { txt.style.height = 'auto'; txt.style.height = Math.min(120, txt.scrollHeight) + 'px'; setComposer(); });
// toque no botão não tira o foco do teclado
$('#sendBtn').addEventListener('mousedown', (e) => { if (txt.value.trim()) e.preventDefault(); });
$('#sendBtn').onclick = async () => {
  if (!chat) return;
  const text = txt.value.trim();
  if (!text) return startRec();
  const id = chat.id, name = displayName(chat.c);
  const p = { text, t: Date.now() };
  chat.pend.push(p); txt.value = ''; txt.style.height = 'auto'; setComposer(); renderMsgs(); $('#msgs').scrollTop = $('#msgs').scrollHeight;
  try { await command('send_text', { chatId: id, text }, '✍️ ' + text.slice(0, 30) + ' → ' + name, true); }
  catch (e) { toast(e.message); if (chat && chat.id === id) { chat.pend = chat.pend.filter((x) => x !== p); txt.value = text; setComposer(); renderMsgs(); } }
};

let rec = null;
async function startRec() {
  if (rec) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Gravação não suportada neste aparelho');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    if (!chat) { stream.getTracks().forEach((t) => t.stop()); return; }
    const AC = window.AudioContext || window.webkitAudioContext; const ac = new AC();
    const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    const chunks = [];
    mr.ondataavailable = (e) => e.data && e.data.size && chunks.push(e.data);
    rec = { mr, stream, ac, chunks, t0: Date.now() };
    rec.timer = setInterval(() => { if (rec) $('#recTime').textContent = mmss((Date.now() - rec.t0) / 1000); }, 250);
    mr.start(250);
    $('#recTime').textContent = '0:00'; $('#recHint').textContent = 'gravando…';
    $('#comp').classList.add('hide'); $('#recBar').classList.remove('hide');
  } catch (e) { toast('Microfone bloqueado: libere em Ajustes → ZapFunil/Safari → Microfone'); }
}
function stopRec(discard) {
  if (!rec) return Promise.resolve(null);
  const r = rec; rec = null; clearInterval(r.timer);
  $('#recBar').classList.add('hide'); $('#comp').classList.remove('hide');
  return new Promise((res) => {
    r.mr.onstop = () => { r.stream.getTracks().forEach((t) => t.stop()); if (discard) { r.ac.close().catch(() => {}); return res(null); } res({ blob: new Blob(r.chunks, { type: r.mr.mimeType || 'audio/mp4' }), ac: r.ac, secs: (Date.now() - r.t0) / 1000 }); };
    try { r.mr.stop(); } catch (e) { r.stream.getTracks().forEach((t) => t.stop()); res(null); }
  });
}
$('#recCancel').onclick = () => stopRec(true);
function toMp3(buf) {
  const sr = buf.sampleRate, ch0 = buf.getChannelData(0), len = ch0.length, pcm = new Int16Array(len);
  for (let i = 0; i < len; i++) { const v = Math.max(-1, Math.min(1, ch0[i])); pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff; }
  const enc = new lamejs.Mp3Encoder(1, sr, 64); const parts = [];
  for (let i = 0; i < len; i += 1152) { const b = enc.encodeBuffer(pcm.subarray(i, i + 1152)); if (b.length) parts.push(new Uint8Array(b)); }
  const end = enc.flush(); if (end.length) parts.push(new Uint8Array(end));
  return new Blob(parts, { type: 'audio/mpeg' });
}
$('#recSend').onclick = async () => {
  if (!chat || !rec) return;
  const target = chat.id, name = displayName(chat.c);
  const r = await stopRec(false);
  if (!r || r.secs < 0.8) { if (r) r.ac.close().catch(() => {}); return toast('Áudio muito curto'); }
  const pend = { audio: true, dur: r.secs, t: Date.now() };
  if (chat && chat.id === target) { chat.pend.push(pend); renderMsgs(); }
  try {
    const decoded = await r.ac.decodeAudioData(await r.blob.arrayBuffer());
    r.ac.close().catch(() => {});
    const mp3 = toMp3(decoded);
    const path = userId + '/' + Date.now() + '.mp3';
    const { error } = await sb.storage.from('zf-audio').upload(path, mp3, { contentType: 'audio/mpeg', upsert: false });
    if (error) throw new Error(error.message);
    await command('send_audio', { chatId: target, path, duration: Math.max(1, Math.round(decoded.duration)), mime: 'audio/mpeg' }, '🎤 Áudio ' + mmss(decoded.duration) + ' → ' + name, true);
  } catch (e) {
    toast('Erro no áudio: ' + e.message);
    if (chat && chat.id === target) { chat.pend = chat.pend.filter((p) => p !== pend); renderMsgs(); }
  }
};

start();
}
